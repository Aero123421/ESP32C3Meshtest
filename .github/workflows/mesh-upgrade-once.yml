name: Apply reviewed mesh source migration
on:
  push:
    branches: [feat/c3-s3-long-range-mesh-lab]
    paths: [.maintenance/apply_upgrade.py]
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'Aero123421/ESP32C3Meshtest'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - run: python .maintenance/apply_upgrade.py
      - name: Commit source changes on this feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/espnow_mesh.cpp src/serial_json_bridge.cpp src/main.cpp include/espnow_mesh.h include/mesh_protocol.h
          git commit -m 'fix(mesh): correlate MAC results, validate frames and expose radio readback'
          git push origin HEAD:refs/heads/feat/c3-s3-long-range-mesh-lab
