name: Finalize reviewed application source
on:
  push:
    branches: [feat/c3-s3-long-range-mesh-lab]
    paths: [.maintenance/finalize_app.py]
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'Aero123421/ESP32C3Meshtest'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .maintenance/finalize_app.py
      - run: python -m pip install pytest==8.3.5 pyserial==3.5
      - run: python -m pytest -q tests/test_mesh_lab.py tests/test_mesh_native.py
      - name: Commit final edits and remove this one-shot helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pc_app/mesh_lab/model.py pc_app/mesh_lab/controller.py pc_app/mesh_lab/server.py tests/test_mesh_lab.py
          git rm .maintenance/finalize_app.py .github/workflows/finalize-app-once.yml
          git commit -m 'fix(app): expire silent links and preserve completed deliveries'
          git push origin HEAD:refs/heads/feat/c3-s3-long-range-mesh-lab
