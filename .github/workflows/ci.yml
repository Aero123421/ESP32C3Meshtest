name: ci
on:
  push:
    branches: [main, feat/c3-s3-long-range-mesh-lab]
  pull_request:
permissions:
  contents: read
concurrency:
  group: mesh-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyserial==3.5 pytest==8.3.5
      - run: python -m compileall -q pc_app tools
      - run: python -m pytest -q tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser code when present
        shell: bash
        run: |
          if test -f pc_app/mesh_lab/web/app.js; then node --check pc_app/mesh_lab/web/app.js; fi
  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [seeed_xiao_esp32c3, seeed_xiao_esp32s3, seeed_xiao_esp32c3_lr, seeed_xiao_esp32s3_lr, seeed_xiao_esp32c3_coexist, seeed_xiao_esp32s3_coexist]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ matrix.environment }}-${{ hashFiles('platformio.ini') }}
      - run: python -m pip install platformio==6.1.18
      - run: python -m platformio run -e ${{ matrix.environment }}
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.environment }}
          path: .pio/build/${{ matrix.environment }}/firmware.bin
          if-no-files-found: error
