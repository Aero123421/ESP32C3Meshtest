name: Mesh Lab browser regression
on:
  pull_request:
  push:
    branches: [main, feat/c3-s3-long-range-mesh-lab]
permissions:
  contents: read
concurrency:
  group: browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyserial==3.5 playwright==1.57.0
      - run: python -m playwright install --with-deps ${{ matrix.engine }}
      - name: Install Japanese fonts for visual evidence
        run: sudo apt-get install -y fonts-noto-cjk
      - name: Exercise real UI and HTTP with simulated serial only
        run: python tools/browser_smoke.py --browser ${{ matrix.engine }} --output browser-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mesh-lab-${{ matrix.engine }}-${{ github.run_id }}
          path: browser-artifacts/
          retention-days: 14
          if-no-files-found: warn
