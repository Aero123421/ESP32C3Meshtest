name: Apply C6 source migration once
on:
  push:
    branches: [feat/c3-s3-long-range-mesh-lab]
    paths: [.github/workflows/c6-code-migrate-once.yml]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/c3-s3-long-range-mesh-lab
          fetch-depth: 0
      - name: Apply C6 source and docs changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if s.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {s.count(old)} for {old[:80]!r}')
              p.write_text(s.replace(old, new), encoding='utf-8')

          Path('platformio.ini').write_text('''[platformio]\ndefault_envs = seeed_xiao_esp32c3\n\n[env]\nplatform = espressif32@6.10.0\nframework = arduino\nmonitor_speed = 115200\nupload_speed = 460800\nbuild_flags =\n    -std=gnu++17\n    -DCORE_DEBUG_LEVEL=0\n    -DARDUINO_LOOP_STACK_SIZE=16384\n    -DLPWA_ALLOW_WIFI_LR_WITH_BLE=0\n    -DLPWA_ENABLE_TRACE_TELEMETRY=0\n    -DLPWA_MESH_CHANNEL=1\n    -DLPWA_MESH_TX_POWER_QDBM=72\nlib_deps =\n    bblanchon/ArduinoJson@6.21.5\n    h2zero/NimBLE-Arduino@2.3.6\n\n[env:seeed_xiao_esp32c3]\nboard = seeed_xiao_esp32c3\nbuild_flags = ${env.build_flags} -DLPWA_ENABLE_BLE_RELAY=0 -DLPWA_ENABLE_WIFI_LR=0\n\n[env:seeed_xiao_esp32s3]\nboard = seeed_xiao_esp32s3\nbuild_flags = ${env.build_flags} -DLPWA_ENABLE_BLE_RELAY=0 -DLPWA_ENABLE_WIFI_LR=0\n\n; XIAO ESP32-C6 requires the newer Seeed Arduino platform. Pin the exact\n; platform commit so C6 stays reproducible while C3/S3 keep Arduino 2.x.\n[env:seeed_xiao_esp32c6]\nplatform = https://github.com/Seeed-Studio/platform-seeedboards.git#1ec1287f8e4bc4067a6fd593991e36875aef989f\nboard = seeed-xiao-esp32-c6\nbuild_flags = ${env.build_flags} -DLPWA_ENABLE_BLE_RELAY=0 -DLPWA_ENABLE_WIFI_LR=0 -DLPWA_XIAO_C6_EXTERNAL_ANTENNA=0\n\n; Experimental LR PHY: verify authorization for the board/antenna/mode first.\n; Use the same profile and channel on ALL participants, including relays.\n[env:seeed_xiao_esp32c3_lr]\nboard = seeed_xiao_esp32c3\nbuild_flags = ${env.build_flags} -DLPWA_ENABLE_BLE_RELAY=0 -DLPWA_ENABLE_WIFI_LR=1\n\n[env:seeed_xiao_esp32s3_lr]\nboard = seeed_xiao_esp32s3\nbuild_flags = ${env.build_flags} -DLPWA_ENABLE_BLE_RELAY=0 -DLPWA_ENABLE_WIFI_LR=1\n\n[env:seeed_xiao_esp32c6_lr]\nplatform = https://github.com/Seeed-Studio/platform-seeedboards.git#1ec1287f8e4bc4067a6fd593991e36875aef989f\nboard = seeed-xiao-esp32-c6\nbuild_flags = ${env.build_flags} -DLPWA_ENABLE_BLE_RELAY=0 -DLPWA_ENABLE_WIFI_LR=1 -DLPWA_XIAO_C6_EXTERNAL_ANTENNA=0\n\n[env:seeed_xiao_esp32c3_coexist]\nboard = seeed_xiao_esp32c3\nbuild_flags = ${env.build_flags} -DLPWA_ENABLE_BLE_RELAY=1 -DLPWA_ENABLE_WIFI_LR=0\n\n[env:seeed_xiao_esp32s3_coexist]\nboard = seeed_xiao_esp32s3\nbuild_flags = ${env.build_flags} -DLPWA_ENABLE_BLE_RELAY=1 -DLPWA_ENABLE_WIFI_LR=0\n\n[env:seeed_xiao_esp32c6_coexist]\nplatform = https://github.com/Seeed-Studio/platform-seeedboards.git#1ec1287f8e4bc4067a6fd593991e36875aef989f\nboard = seeed-xiao-esp32-c6\nbuild_flags = ${env.build_flags} -DLPWA_ENABLE_BLE_RELAY=1 -DLPWA_ENABLE_WIFI_LR=0 -DLPWA_XIAO_C6_EXTERNAL_ANTENNA=0\n''', encoding='utf-8')

          replace_once('include/espnow_mesh.h', '#include <esp_now.h>\n', '#include <esp_now.h>\n#include <esp_idf_version.h>\n')
          replace_once('include/espnow_mesh.h',
              '  static void onSendStatic(const uint8_t* mac_addr, esp_now_send_status_t status);\n#if ESP_ARDUINO_VERSION_MAJOR >= 3\n',
              '''#if ESP_IDF_VERSION >= ESP_IDF_VERSION_VAL(5, 5, 0)\n  static void onSendStatic(const esp_now_send_info_t* tx_info, esp_now_send_status_t status);\n#else\n  static void onSendStatic(const uint8_t* mac_addr, esp_now_send_status_t status);\n#endif\n#if ESP_ARDUINO_VERSION_MAJOR >= 3\n''')

          replace_once('src/espnow_mesh.cpp',
              '  WiFi.persistent(false);\n',
              '''#if defined(ARDUINO_XIAO_ESP32C6)\n  // XIAO C6 RF switch: GPIO3 enables software selection and GPIO14 selects\n  // onboard (LOW) versus external U.FL (HIGH). Default to onboard.\n  pinMode(3, OUTPUT);\n  digitalWrite(3, LOW);\n  delay(100);\n  pinMode(14, OUTPUT);\n#if LPWA_XIAO_C6_EXTERNAL_ANTENNA\n  digitalWrite(14, HIGH);\n#else\n  digitalWrite(14, LOW);\n#endif\n#endif\n\n  WiFi.persistent(false);\n''')
          replace_once('src/espnow_mesh.cpp',
              '''void EspNowMesh::onSendStatic(const uint8_t* mac_addr, esp_now_send_status_t status) {\n  if (instance_ != nullptr) {\n    instance_->onSend(mac_addr, status);\n  }\n}\n\n''',
              '''#if ESP_IDF_VERSION >= ESP_IDF_VERSION_VAL(5, 5, 0)\nvoid EspNowMesh::onSendStatic(const esp_now_send_info_t* tx_info, esp_now_send_status_t status) {\n  if (instance_ != nullptr) {\n    instance_->onSend(tx_info != nullptr ? tx_info->des_addr : nullptr, status);\n  }\n}\n#else\nvoid EspNowMesh::onSendStatic(const uint8_t* mac_addr, esp_now_send_status_t status) {\n  if (instance_ != nullptr) {\n    instance_->onSend(mac_addr, status);\n  }\n}\n#endif\n\n''')

          replace_once('pc_app/mesh_lab/controller.py',
              "ENVS = tuple('seeed_xiao_esp32' + chip + suffix for chip in ('c3', 's3')\n",
              "ENVS = tuple('seeed_xiao_esp32' + chip + suffix for chip in ('c3', 's3', 'c6')\n")

          replace_once('pc_app/mesh_lab/web/index.html', '<title>Mesh Lab · C3 / S3</title>', '<title>Mesh Lab · C3 / S3 / C6</title>')
          replace_once('pc_app/mesh_lab/web/index.html', 'C3 / S3 · Local workspace', 'C3 / S3 / C6 · Local workspace')
          replace_once('pc_app/mesh_lab/web/index.html', 'C3 / S3 をUSBで接続してください', 'C3 / S3 / C6 をUSBで接続してください')
          replace_once('pc_app/mesh_lab/web/index.html', 'ESP-NOW Hybrid Mesh <b>·</b> XIAO ESP32-C3 / ESP32-S3', 'ESP-NOW Hybrid Mesh <b>·</b> XIAO ESP32-C3 / ESP32-S3 / ESP32-C6')
          replace_once('pc_app/mesh_lab/web/index.html',
              '<option value="seeed_xiao_esp32s3">XIAO ESP32-S3 · 通常 / 1 Mbps</option>',
              '<option value="seeed_xiao_esp32s3">XIAO ESP32-S3 · 通常 / 1 Mbps</option><option value="seeed_xiao_esp32c6">XIAO ESP32-C6 · 通常 / 1 Mbps</option>')
          replace_once('pc_app/mesh_lab/web/index.html',
              '<option value="seeed_xiao_esp32s3_lr">XIAO ESP32-S3 · LR / 250 kbps</option>',
              '<option value="seeed_xiao_esp32s3_lr">XIAO ESP32-S3 · LR / 250 kbps</option><option value="seeed_xiao_esp32c6_lr">XIAO ESP32-C6 · LR / 250 kbps</option>')
          replace_once('pc_app/mesh_lab/web/index.html',
              '<option value="seeed_xiao_esp32s3_coexist">XIAO ESP32-S3 · BLE共存</option>',
              '<option value="seeed_xiao_esp32s3_coexist">XIAO ESP32-S3 · BLE共存</option><option value="seeed_xiao_esp32c6_coexist">XIAO ESP32-C6 · BLE共存</option>')
          replace_once('pc_app/mesh_lab/web/index.html', 'C3用とS3用のbinは別物です。', 'C3 / S3 / C6 のbinはそれぞれ別物です。')
          replace_once('tools/browser_smoke.py', "expect(page).to_have_title('Mesh Lab · C3 / S3')", "expect(page).to_have_title('Mesh Lab · C3 / S3 / C6')")

          p = Path('README.md'); s = p.read_text(encoding='utf-8')
          s = s.replace('# Mesh Lab — XIAO ESP32-C3 / ESP32-S3', '# Mesh Lab — XIAO ESP32-C3 / ESP32-S3 / ESP32-C6', 1)
          s = s.replace('C3/S3の無線設定', 'C3/S3/C6の無線設定', 1)
          s = s.replace('C3/S3別bin、6環境', 'C3/S3/C6別bin、9環境', 1)
          s = s.replace('## 2. C3/S3のビルドは別々', '## 2. C3/S3/C6のビルドは別々', 1)
          s = s.replace('**C3とS3で同じ `.bin` は使えません。** C3はRISC-V、S3はXtensaです。', '**C3/S3/C6で同じ `.bin` は使えません。** C3/C6はRISC-V、S3はXtensaです。C6はESP-IDF 5.1+が必要なため、このrepoではSeeedのPlatformIO platformをcommit固定してArduino 3.xでビルドします。', 1)
          for after, row in [
              ('| `seeed_xiao_esp32s3` | XIAO S3 | 通常 / 1Mbps | OFF |\n', '| `seeed_xiao_esp32c6` | XIAO C6 | 通常 / 1Mbps | OFF |\n'),
              ('| `seeed_xiao_esp32s3_lr` | XIAO S3 | LR / 250kbps（実験用） | OFF |\n', '| `seeed_xiao_esp32c6_lr` | XIAO C6 | LR / 250kbps（実験用） | OFF |\n'),
              ('| `seeed_xiao_esp32s3_coexist` | XIAO S3 | 通常 / BLE共存 | ON |\n', '| `seeed_xiao_esp32c6_coexist` | XIAO C6 | 通常 / BLE共存 | ON |\n')]:
              s = s.replace(after, after + row, 1)
          s = s.replace('python -m platformio run -e seeed_xiao_esp32s3\n', 'python -m platformio run -e seeed_xiao_esp32s3\npython -m platformio run -e seeed_xiao_esp32c6\n', 1)
          s = s.replace('python -m platformio run -e seeed_xiao_esp32s3_lr\n', 'python -m platformio run -e seeed_xiao_esp32s3_lr\npython -m platformio run -e seeed_xiao_esp32c6_lr\n', 1)
          s = s.replace('## 3. C3とS3はGPIO番号が違う', '## 3. C3/S3/C6はGPIO番号が違う', 1)
          s = s.replace('| XIAO端子 | C3のGPIO | S3のGPIO |\n|---|---:|---:|\n| D0 | 2 | 1 |\n| D1 | 3 | 2 |\n| D2 | 4 | 3 |\n| D3 | 5 | 4 |\n| D4 / SDA | 6 | 5 |\n| D5 / SCL | 7 | 6 |\n| D6 / TX | 21 | 43 |\n| D7 / RX | 20 | 44 |\n| D8 / SCK | 8 | 7 |\n| D9 / MISO | 9 | 8 |\n| D10 / MOSI | 10 | 9 |', '| XIAO端子 | C3のGPIO | S3のGPIO | C6のGPIO |\n|---|---:|---:|---:|\n| D0 | 2 | 1 | 0 |\n| D1 | 3 | 2 | 1 |\n| D2 | 4 | 3 | 2 |\n| D3 | 5 | 4 | 21 |\n| D4 / SDA | 6 | 5 | 22 |\n| D5 / SCL | 7 | 6 | 23 |\n| D6 / TX | 21 | 43 | 16 |\n| D7 / RX | 20 | 44 | 17 |\n| D8 / SCK | 8 | 7 | 19 |\n| D9 / MISO | 9 | 8 | 20 |\n| D10 / MOSI | 10 | 9 | 18 |', 1)
          s = s.replace('## 4. 長距離試験と日本国内の運用\n', '''### XIAO ESP32-C6のアンテナ切替\n\nC6はRF switchを内蔵しています。このrepoのC6環境は安全側で**オンボードアンテナを既定**にします。外部U.FLを使う場合は、対象アンテナ/構成の認証条件を確認した上でC6環境の `LPWA_XIAO_C6_EXTERNAL_ANTENNA=0` を `1` に変更してください。ファームはGPIO3をLowにしてRF switch制御を有効化し、GPIO14 Low=内蔵 / High=外部を選択します。\n\n## 4. 長距離試験と日本国内の運用\n''', 1)
          p.write_text(s, encoding='utf-8')

          p = Path('pc_app/README.md'); s = p.read_text(encoding='utf-8'); s=s.replace('C3/S3別ビルド','C3/S3/C6別ビルド').replace('C3/S3ビルド/書き込み','C3/S3/C6ビルド/書き込み'); p.write_text(s, encoding='utf-8')
          p = Path('AGENTS.md'); s = p.read_text(encoding='utf-8').replace('対象ハード: Seeed Studio XIAO ESP32C3 を3〜10台使用','対象ハード: Seeed Studio XIAO ESP32-C3 / ESP32-S3 / ESP32-C6 を3〜10台使用'); p.write_text(s, encoding='utf-8')
          p = Path('docs/architecture.md'); s=p.read_text(encoding='utf-8').replace('C3/S3対応','C3/S3/C6対応').replace('通常/LR/BLE共存×C3/S3の6環境','通常/LR/BLE共存×C3/S3/C6の9環境').replace('SoC別のbin','C3/S3/C6それぞれSoC別のbin'); p.write_text(s,encoding='utf-8')
          p = Path('docs/esp32c3_research.md'); s=p.read_text(encoding='utf-8').replace('# C3/S3 RF設定と認証上の注意','# C3/S3/C6 RF設定と認証上の注意',1).replace('C3とS3は同じESP-NOW wire形式','C3/S3/C6は同じESP-NOW wire形式',1); s += '\n\n## C6のSDK差\n\nESP32-C6はESP-IDF 5.1以降でサポートされるため、C3/S3の固定Arduino 2.x環境へ無理に載せません。C6はSeeed PlatformIO platformのcommitを固定し、Arduino 3.3.7系で別ビルドします。IDF 5.5以降で変更されたESP-NOW送信callbackも条件コンパイルで吸収し、wire formatは共通に保ちます。C6のWi-Fi 6機能はこの互換Meshでは使用せず、2.4GHz ESP-NOW共通設定を使用します。\n'; p.write_text(s,encoding='utf-8')
          p = Path('docs/field_validation.md'); s=p.read_text(encoding='utf-8').replace('C3→C3、C3→S3、S3→C3、S3→S3','C3→C3、C3→S3、C3→C6、S3→C3、S3→S3、S3→C6、C6→C3、C6→S3、C6→C6').replace('実RFでのC3/S3相互運用','実RFでのC3/S3/C6相互運用'); p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and push non-workflow changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add platformio.ini include/espnow_mesh.h src/espnow_mesh.cpp pc_app tools README.md AGENTS.md docs
          git diff --cached --check
          git commit -m 'feat: add XIAO ESP32-C6 mesh support across Arduino 3 and IDF 5'
          git push origin HEAD:feat/c3-s3-long-range-mesh-lab
