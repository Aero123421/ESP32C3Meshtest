[platformio]
default_envs = seeed_xiao_esp32c3

[env]
platform = espressif32@6.10.0
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_LOOP_STACK_SIZE=16384
    -DLPWA_ALLOW_WIFI_LR_WITH_BLE=0
    -DLPWA_ENABLE_TRACE_TELEMETRY=0
    -DLPWA_MESH_CHANNEL=1
    -DLPWA_MESH_TX_POWER_QDBM=72
lib_deps =
    bblanchon/ArduinoJson@6.21.5
    h2zero/NimBLE-Arduino@2.3.6

[env:seeed_xiao_esp32c3]
board = seeed_xiao_esp32c3
build_flags = ${env.build_flags} -DLPWA_ENABLE_BLE_RELAY=0 -DLPWA_ENABLE_WIFI_LR=0

[env:seeed_xiao_esp32s3]
board = seeed_xiao_esp32s3
build_flags = ${env.build_flags} -DLPWA_ENABLE_BLE_RELAY=0 -DLPWA_ENABLE_WIFI_LR=0

; XIAO ESP32-C6 requires the newer Seeed Arduino platform. Pin the exact
; platform commit so C6 stays reproducible while C3/S3 keep Arduino 2.x.
[env:seeed_xiao_esp32c6]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git#1ec1287f8e4bc4067a6fd593991e36875aef989f
board = seeed-xiao-esp32-c6
build_flags = ${env.build_flags} -DLPWA_ENABLE_BLE_RELAY=0 -DLPWA_ENABLE_WIFI_LR=0 -DLPWA_XIAO_C6_EXTERNAL_ANTENNA=0

; Experimental LR PHY: verify authorization for the board/antenna/mode first.
; Use the same profile and channel on ALL participants, including relays.
[env:seeed_xiao_esp32c3_lr]
board = seeed_xiao_esp32c3
build_flags = ${env.build_flags} -DLPWA_ENABLE_BLE_RELAY=0 -DLPWA_ENABLE_WIFI_LR=1

[env:seeed_xiao_esp32s3_lr]
board = seeed_xiao_esp32s3
build_flags = ${env.build_flags} -DLPWA_ENABLE_BLE_RELAY=0 -DLPWA_ENABLE_WIFI_LR=1

[env:seeed_xiao_esp32c6_lr]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git#1ec1287f8e4bc4067a6fd593991e36875aef989f
board = seeed-xiao-esp32-c6
build_flags = ${env.build_flags} -DLPWA_ENABLE_BLE_RELAY=0 -DLPWA_ENABLE_WIFI_LR=1 -DLPWA_XIAO_C6_EXTERNAL_ANTENNA=0

[env:seeed_xiao_esp32c3_coexist]
board = seeed_xiao_esp32c3
build_flags = ${env.build_flags} -DLPWA_ENABLE_BLE_RELAY=1 -DLPWA_ENABLE_WIFI_LR=0

[env:seeed_xiao_esp32s3_coexist]
board = seeed_xiao_esp32s3
build_flags = ${env.build_flags} -DLPWA_ENABLE_BLE_RELAY=1 -DLPWA_ENABLE_WIFI_LR=0

[env:seeed_xiao_esp32c6_coexist]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git#1ec1287f8e4bc4067a6fd593991e36875aef989f
board = seeed-xiao-esp32-c6
build_flags = ${env.build_flags} -DLPWA_ENABLE_BLE_RELAY=1 -DLPWA_ENABLE_WIFI_LR=0 -DLPWA_XIAO_C6_EXTERNAL_ANTENNA=0
